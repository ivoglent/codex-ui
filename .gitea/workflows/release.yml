name: Codex UI Docker Release

on:
  push:
    branches: [develop, master]

env:
  REGISTRY: docker.codecuatui.com
  IMAGE: docker.codecuatui.com/ai/codex-ui

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Select tag
        id: image
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${{ env.IMAGE }}:${{ steps.image.outputs.tag }} .
          docker push ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}

      - name: Clean release image
        if: always()
        run: |
          docker image rm --force ${{ env.IMAGE }}:${{ steps.image.outputs.tag }} 2>/dev/null || true
          docker builder prune --all --force
