name: Docker CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg CODEX_VERSION=$(awk -F= '/^ARG CODEX_VERSION=/{print $2}' Dockerfile) -t ivoglent/codex-ui:ci .
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: codex
        run: echo "version=$(awk -F= '/^ARG CODEX_VERSION=/{print $2}' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ivoglent/codex-ui
          tags: |
            type=raw,value=${{ steps.codex.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CODEX_VERSION=${{ steps.codex.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
