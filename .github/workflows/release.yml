name: Docker CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg CODEX_VERSION=$(awk -F= '/^ARG CODEX_VERSION=/{print $2}' Dockerfile) -t ivoglent/codex-ui:ci .
  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Docker Hub publication because DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not configured."
          fi
      - if: steps.registry.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: codex
        run: echo "version=$(awk -F= '/^ARG CODEX_VERSION=/{print $2}' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ivoglent/codex-ui
          tags: |
            type=raw,value=${{ steps.codex.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CODEX_VERSION=${{ steps.codex.outputs.version }}
          push: ${{ steps.registry.outputs.configured == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
