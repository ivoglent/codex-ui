services:
  codex-ui:
    image: codex-control:dev
    build:
      context: .
    container_name: codex-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      CODEX_HOME: /home/app/.codex
      CODEX_CWD: /workspace
      PROJECTS_ROOT: /workspace
      PROJECTS_CONFIG: /app/config/projects.yaml
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:3210}"
      APP_TITLE: "${APP_TITLE:-Codex Control}"
      APP_SHORT_NAME: "${APP_SHORT_NAME:-Codex}"
      APP_ICON_URL: "${APP_ICON_URL:-/favicon.svg}"
      APP_THEME_COLOR: "${APP_THEME_COLOR:-#111827}"
      APP_BACKGROUND_COLOR: "${APP_BACKGROUND_COLOR:-#090d16}"
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_VAPID_SUBJECT: "${WEB_PUSH_VAPID_SUBJECT:-}"
      WEB_PUSH_SUBSCRIPTIONS_PATH: /home/app/.codex/codex-ui/web-push-subscriptions.json
    volumes:
      - "${PROJECTS_ROOT}:/workspace"
      - "${HOST_CODEX_HOME:-${HOME}/.codex}:/home/app/.codex"
      - ./config/projects.container.yaml:/app/config/projects.yaml:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
